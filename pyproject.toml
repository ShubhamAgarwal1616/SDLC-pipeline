[project]
name = "sdlc-pipeline"
version = "0.2.0"
description = "Two-phase agentic SDLC pipeline: orchestrator, state machine and the sdlc CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pynacl>=1.5",
]

[project.scripts]
sdlc = "sdlc.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator/sdlc"]

# Read-only assets an installed CLI needs (sdlc.config.ROOT points here when installed).
[tool.hatch.build.targets.wheel.force-include]
"config/org.yaml" = "sdlc/_assets/config/org.yaml"
"orchestrator/contracts" = "sdlc/_assets/orchestrator/contracts"
"skills" = "sdlc/_assets/skills"
"evals" = "sdlc/_assets/evals"

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
pythonpath = ["orchestrator"]
