apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: stubs-

commonLabels:
  environment: stubs

resources:
  - ../base

patchesStrategicMerge:
  - configmap.yaml
  - serviceAccount.yaml

configMapGenerator:
  - name: offer-code-publisher
    behavior: merge
    envs:
      - application.env
    literals:
      - CONTRAST__ENABLE=true
      - CONTRAST__AGENT__JAVA__STANDALONE_APP_NAME=${CONTRAST_APP_NAME}
      - CONTRAST__AGENT__LOGGER__STDOUT=true
      - CONTRAST__SERVER__NAME=${CONTRAST_SERVER}
      - CONTRAST__SERVER__ENVIRONMENT=development
      - CONTRAST__API__URL="https://app.contrastsecurity.com/Contrast"
