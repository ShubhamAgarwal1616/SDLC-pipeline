apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: entitlements

commonLabels:
  app: offer-code-publisher

resources:
  - cronjob.yaml
  - configmap.yaml
  - serviceAccount.yaml

configMapGenerator:
  - name: offer-code-publisher
    behavior: merge
    envs:
      - application.env
