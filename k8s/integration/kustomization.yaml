apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: integration-

commonLabels:
  environment: integration

resources:
  - ../base

patchesStrategicMerge:
  - configmap.yaml
  - serviceAccount.yaml

configMapGenerator:
  - name: offer-code-publisher
    behavior: merge
    envs:
      - application.env
