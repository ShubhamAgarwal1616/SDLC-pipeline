# Release the pipeline: on a tag vX.Y.Z (matching pyproject's version), run the tests, then build and push the
# worker and gateway images to GHCR for amd64 (GitHub runners) and arm64 (Apple Silicon laptops).
# Repos set up with `sdlc init` install the CLI at that tag and pull these images; nobody builds them locally.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(uv run sdlc version | awk '{print $2}')"
          test "v${want}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject ${want}"; exit 1; }

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: sdlc-worker, dockerfile: worker/Dockerfile }
          - { name: sdlc-gateway, dockerfile: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="dev-${GITHUB_SHA::7}"
          echo "ref=ghcr.io/${owner}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ver.outputs.ref }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
