# Added by `sdlc init --relay-to {{home}}` (sdlc-pipeline {{version}}).
# This repo takes part in multi-repo features run from {{home}}. When something happens on one of the
# pipeline's PRs here (a /sdlc command, a review, a merge), tell the home repo's workflow to reconcile.
# Needs the secret SDLC_RELAY_TOKEN: a token allowed to dispatch to {{home}} (Contents: read and write there).
name: sdlc-relay

on:
  issue_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  pull_request_review_comment: { types: [created] }
  pull_request: { types: [closed] }

permissions: {}

jobs:
  relay:
    if: >-
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'chore/archive-'))) ||
      (github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || startsWith(github.event.review.body, '/sdlc'))) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/sdlc')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/sdlc'))
    runs-on: ubuntu-latest
    steps:
      - name: Ping {{home}}
        env:
          GH_TOKEN: ${{ secrets.SDLC_RELAY_TOKEN }}
        run: gh api "repos/{{home}}/dispatches" -f event_type=sdlc-relay -f "client_payload[repo]=${{ github.repository }}"
