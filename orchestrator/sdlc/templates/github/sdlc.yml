# Added by `sdlc init` (sdlc-pipeline {{version}}). Re-run `sdlc init` to update it.
#
# Every trigger runs the same idempotent `sdlc ci reconcile`: it starts runs for new "sdlc" issues, applies
# /sdlc commands from issues and PRs, advances runs whose PRs were merged, and posts updates. Runs are
# serialised; an event dropped by the concurrency queue is picked up by the next reconcile.
name: sdlc

on:
  issues: { types: [opened, edited, labeled, reopened] }
  issue_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  pull_request_review_comment: { types: [created] }
  pull_request: { types: [closed] }
  schedule: [{ cron: "23 */6 * * *" }]     # reminders, stale runs, keeps the saved state fresh
  workflow_dispatch: {}
  repository_dispatch: { types: [sdlc-relay] }   # member repos of a multi-repo feature (sdlc-relay.yml)

concurrency: { group: sdlc, cancel-in-progress: false }

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read          # to read the previous job's saved state

jobs:
  reconcile:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'sdlc')) ||
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'chore/archive-'))) ||
      (github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || startsWith(github.event.review.body, '/sdlc'))) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && startsWith(github.event.comment.body, '/sdlc'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SDLC_HOME: ${{ github.workspace }}/.sdlc-home
      # A bot token (secret SDLC_GITHUB_TOKEN) makes the bot's PRs trigger your CI, and is required for features
      # across several repos (it must reach all of them); github.token works for a single repo without one.
      GITHUB_TOKEN: ${{ secrets.SDLC_GITHUB_TOKEN || github.token }}
      SDLC_ACTIONS_TOKEN: ${{ github.token }}
      SDLC_STATE_KEY: ${{ secrets.SDLC_STATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}       # optional: project.docs confluence
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}     # optional: defaults to JIRA_API_TOKEN
      # Optional model choices: repo Settings → Secrets and variables → Actions → Variables.
      SDLC_MODEL_DEFAULT: ${{ vars.SDLC_MODEL_DEFAULT }}
      SDLC_MODEL_GRILL: ${{ vars.SDLC_MODEL_GRILL }}
      SDLC_MODEL_PROPOSE: ${{ vars.SDLC_MODEL_PROPOSE }}
      SDLC_MODEL_IMPLEMENT: ${{ vars.SDLC_MODEL_IMPLEMENT }}
      SDLC_MODEL_REVIEW: ${{ vars.SDLC_MODEL_REVIEW }}
      SDLC_MODEL_RESOLVE_COMMENTS: ${{ vars.SDLC_MODEL_RESOLVE_COMMENTS }}
      SDLC_MODEL_REVIEW_FOLLOWUP: ${{ vars.SDLC_MODEL_REVIEW_FOLLOWUP }}
      SDLC_ALLOWED_MODELS: ${{ vars.SDLC_ALLOWED_MODELS }}
      SDLC_MODEL_MAP_JSON: ${{ vars.SDLC_MODEL_MAP_JSON }}
    steps:
      - name: Check out build files (for the dependency cache key)
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            build.gradle.kts
            settings.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - name: Dependency caches (Gradle, npm)
        uses: actions/cache@v4
        with:
          path: |
            .sdlc-home/runs/_cache/gradle
            .sdlc-home/runs/_cache/deps
          key: sdlc-deps-${{ hashFiles('repo/build.gradle.kts', 'repo/settings.gradle.kts', 'repo/gradle/wrapper/gradle-wrapper.properties', 'repo/package.json', 'repo/package-lock.json') }}
          restore-keys: sdlc-deps-
      - uses: astral-sh/setup-uv@v6
      - name: Install the sdlc CLI
        run: uv tool install "{{install}}"
      - name: Reconcile
        run: sdlc ci reconcile
      - name: Save run state (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-state
          path: .sdlc-home/out/state.enc
          retention-days: 30
          if-no-files-found: ignore
