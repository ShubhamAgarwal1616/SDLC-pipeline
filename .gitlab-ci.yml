stages:
  - build
  - security-test
  - deploy-stubs
  - deploy-integration
  - deploy-prod

default:
  tags:
  - jldp-ci

###############################
########## Variables ##########
###############################

variables:
  CONTAINER_IMAGE: eu.gcr.io/jl-container-images/entitlements/offer-code-publisher
  CONTRAST_APP_NAME: "${TENANT_NAME}-offer-code-publisher"
  CONTRAST_SERVER: "${TENANT_NAME}-offer-code-publisher-${CI_PIPELINE_IID}"
  CONTRAST_APP_ID: "b5369cae-7a5a-4ac3-a87e-bf53f4fa195f"
  ENVIRONMENT: ${CI_ENVIRONMENT_NAME}

.stubs:
  variables:
    CI_SERVICE_ACCOUNT_KEY: $CI_SERVICE_ACCOUNT_KEY_FLEX
    K8S_PROJECT: jl-platform-k8s-flex
    CLUSTER: $K8S_CLUSTER_NAME_FLEX
    REGION: $K8S_CLUSTER_REGION_FLEX
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-flex
  environment:
    name: stubs

.integration:
  variables:
    CI_SERVICE_ACCOUNT_KEY: $CI_SERVICE_ACCOUNT_KEY_FLEX
    K8S_PROJECT: jl-platform-k8s-flex
    CLUSTER: $K8S_CLUSTER_NAME_FLEX
    REGION: $K8S_CLUSTER_REGION_FLEX
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-flex
  environment:
    name: integration

.prod:
  variables:
    CI_SERVICE_ACCOUNT_KEY: $CI_SERVICE_ACCOUNT_KEY_PROD
    K8S_PROJECT: jl-platform-k8s-prod
    CLUSTER: $K8S_CLUSTER_NAME_PROD
    REGION: $K8S_CLUSTER_REGION_PROD
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-prod
  environment:
    name: prod

.deploy:
  image: eu.gcr.io/jl-container-images/platform/jldp-deploy-tools:20.08
  before_script:
    - gcloud container clusters get-credentials ${CLUSTER} --region ${REGION} --project ${K8S_PROJECT}
  script:
    - (cd k8s/${CI_ENVIRONMENT_NAME}; kustomize edit set image ${CONTAINER_IMAGE}:${CI_PIPELINE_IID})
    - kustomize build k8s/${CI_ENVIRONMENT_NAME} | envsubst '${ENVIRONMENT} ${CONTRAST_SERVER} ${CONTRAST_APP_NAME} ${CONTRAST_AGENT_USERNAME} ${CONTRAST_AGENT_SERVICE_KEY} ${CONTRAST_API_KEY}' | kubectl apply -f -

###########################
########## Build ##########
###########################

build:
  stage: build
  image: adoptopenjdk:11-jdk-hotspot
  variables:
    GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Djib.console=plain
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    - printf "%s" "${CI_SERVICE_ACCOUNT_KEY_FLEX}" > /tmp/google-credentials.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/google-credentials.json
  script:
    - ./gradlew build
    - ./gradlew jib
  cache:
    paths:
      - .gradle
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties

############################
########## Deploy ##########
############################

deploy-stubs:
  stage: deploy-stubs
  needs:
    - job: build
  extends:
    - .deploy
    - .stubs

deploy-integration:
  stage: deploy-integration
  needs:
    - job: deploy-stubs
  extends:
    - .deploy
    - .integration
  only:
    - master

deploy-prod:
  stage: deploy-prod
  needs:
    - job: deploy-integration
  extends:
    - .deploy
    - .prod
  only:
    - master
  when: manual

############################
########## Tests ###########
############################

check-dependency-vulnerabilities:
  stage: security-test
  image: adoptopenjdk/openjdk11:alpine-jre
  script:
    - apk add npm
    - npm install -g @contrast/contrast-cli
    - contrast-cli --api_key ${CONTRAST_API_KEY} --authorization ${CONTRAST_AUTH} --organization_id ${CONTRAST_ORG_UUID} --language JAVA --application_name ${CONTRAST_APP_NAME} --application_id ${CONTRAST_APP_ID} --report --fail
  allow_failure: true



