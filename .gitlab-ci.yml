include:
  - project: 'JohnLewisPartnership/digital/services/entitlements/change-management-script'
    ref: main
    file: '.change-management-script.yml'
  - project: 'JohnLewisPartnership/digital/platform/gitlab-ci/gitlab-ci-includes'
    file: templates/security/snyk-scanner.yaml

stages:
  - build
  - security-test
  - deploy-stubs
  - deploy-integration
  - create-change
  - deploy-prod
  - close-change


###############################
########## Variables ##########
###############################

variables:
  CONTAINER_IMAGE: eu.gcr.io/jl-container-images/entitlements/offer-code-publisher
  ENVIRONMENT: ${CI_ENVIRONMENT_NAME}

.stubs:
  variables:
    K8S_PROJECT: jl-platform-k8s-flex
    CLUSTER: $K8S_CLUSTER_NAME_FLEX
    REGION: $K8S_CLUSTER_REGION_FLEX
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-flex
  environment:
    name: stubs

.integration:
  variables:
    K8S_PROJECT: jl-platform-k8s-flex
    CLUSTER: $K8S_CLUSTER_NAME_FLEX
    REGION: $K8S_CLUSTER_REGION_FLEX
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-flex
  environment:
    name: integration

.prod:
  variables:
    K8S_PROJECT: jl-platform-k8s-prod
    CLUSTER: $K8S_CLUSTER_NAME_PROD
    REGION: $K8S_CLUSTER_REGION_PROD
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: ci-prod
  environment:
    name: prod

.deploy:
  image: eu.gcr.io/jl-container-images/platform/docker-images/jldp-deploy-tools:2024.09
  before_script:
    - gcloud container clusters get-credentials ${CLUSTER} --region ${REGION} --project ${K8S_PROJECT} --dns-endpoint
  script:
    - (cd k8s/${CI_ENVIRONMENT_NAME}; kustomize edit set image ${CONTAINER_IMAGE}:${CI_PIPELINE_IID})
    - kustomize build k8s/${CI_ENVIRONMENT_NAME} | envsubst '${ENVIRONMENT}' | kubectl apply -f -

###########################
########## Build ##########
###########################

build:
  stage: build
  image: adoptopenjdk:11-jdk-hotspot
  variables:
    GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Djib.console=plain
  before_script:
    - export GRADLE_USER_HOME=$(pwd)/.gradle
  script:
    - ./gradlew build
    - ./gradlew jib
  cache:
    paths:
      - .gradle
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties

############################
########## Deploy ##########
############################

deploy-stubs:
  stage: deploy-stubs
  needs:
    - job: build
  extends:
    - .deploy
    - .stubs

deploy-integration:
  stage: deploy-integration
  extends:
    - .deploy
    - .integration
  only:
    - master

deploy-prod:
  stage: deploy-prod
  extends:
    - .deploy
    - .prod
  only:
    - master
  when: manual

############################
########## Tests ###########
############################

security-scan:
  stage: security-test
  extends: .snyk-code-scanner

security-library-scan:
  stage: security-test
  extends: .snyk-library-scanner


